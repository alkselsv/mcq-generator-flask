<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор вопросов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .alert-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1050;
        }

        .alert {
            margin: 0;
            border-radius: 0;
            animation: slideDown 0.5s ease-in-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .alert.fade-out {
            animation: slideUp 0.5s ease-in-out forwards;
        }

        @keyframes slideUp {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-100%);
            }
        }

        #questions,
        #downloadBtns {
            transition: opacity 0.3s ease, filter 0.3s ease;
        }

        #questions.questions-stale,
        #downloadBtns.questions-stale {
            opacity: 0.4;
            filter: grayscale(0.35);
            pointer-events: none;
            user-select: none;
        }

        .questions-results {
            position: relative;
        }

        .questions-results.has-generation-progress {
            min-height: 7rem;
        }

        .generation-progress {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 1.5rem 1rem 0;
            pointer-events: none;
        }

        .generation-progress-card {
            width: min(420px, 100%);
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 0.5rem;
            padding: 1rem 1.25rem;
            box-shadow: 0 0.5rem 1.25rem rgba(0, 0, 0, 0.08);
        }

        .generation-progress .progress {
            height: 1.35rem;
        }

        .generation-progress .progress-bar {
            font-size: 0.8rem;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="container mt-5 mb-5">
        <h1 class="mb-4">Генератор вопросов</h1>

        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="input-tab" data-bs-toggle="tab" data-bs-target="#input"
                    type="button" role="tab" aria-controls="input" aria-selected="true">Исходный текст</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="simplified-tab" data-bs-toggle="tab" data-bs-target="#simplified"
                    type="button" role="tab" aria-controls="simplified" aria-selected="false">Упрощенный текст</button>
            </li>
        </ul>

        <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="input" role="tabpanel" aria-labelledby="input-tab">
                <form id="questionForm" class="mt-3">
                    <div class="mb-3">
                        <textarea class="form-control" id="text" name="text" rows="15" maxlength="{{ max_text_length }}" required></textarea>
                        <div class="form-text">Длина текста: <span id="textLength">0</span> / {{ max_text_length }} символов (минимум:
                            {{ min_text_length }})</div>
                    </div>
                    <div class="mb-3">
                        <button type="button" class="btn btn-secondary" id="simplifyBtn">
                            <span class="spinner-border spinner-border-sm d-none" role="status"
                                aria-hidden="true"></span>
                            <span class="btn-text">Упростить текст</span>
                        </button>
                        <button type="button" class="btn btn-outline-danger d-none" id="cancelSimplifyBtn">Остановить</button>
                    </div>
                    <div class="mb-3 d-flex align-items-center gap-2">
                        <label for="numQuestions" class="form-label mb-0">Количество вопросов:</label>
                        <input type="number" class="form-control" id="numQuestions" name="numQuestions"
                            min="{{ min_num_questions }}" max="{{ max_num_questions }}"
                            value="{{ default_num_questions }}" style="width: 80px;">
                        <button type="submit" class="btn btn-primary" id="generateBtn">
                            <span class="spinner-border spinner-border-sm d-none" role="status"
                                aria-hidden="true"></span>
                            <span class="btn-text">Сгенерировать вопросы</span>
                        </button>
                        <button type="button" class="btn btn-outline-danger d-none" id="cancelGenerateBtn">Остановить</button>
                    </div>
                </form>
            </div>
            <div class="tab-pane fade" id="simplified" role="tabpanel" aria-labelledby="simplified-tab">
                <div id="simplifiedText" class="mt-3"></div>
                <div class="mt-3 d-flex align-items-center gap-2">
                    <label for="numQuestionsSimplified" class="form-label mb-0">Количество вопросов:</label>
                    <input type="number" class="form-control" id="numQuestionsSimplified" name="numQuestionsSimplified"
                        min="{{ min_num_questions }}" max="{{ max_num_questions }}" value="{{ default_num_questions }}" style="width: 80px;">
                    <button type="button" class="btn btn-primary" id="generateSimplifiedBtn">
                        <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        <span class="btn-text">Сгенерировать вопросы</span>
                    </button>
                    <button type="button" class="btn btn-outline-danger d-none" id="cancelGenerateSimplifiedBtn">Остановить</button>
                </div>
            </div>
        </div>

        <div class="questions-results mt-4" id="questionsResults">
            <div id="generationProgress" class="generation-progress d-none" aria-live="polite">
                <div class="generation-progress-card">
                    <div class="d-flex justify-content-between align-items-baseline mb-2 gap-3">
                        <span class="fw-semibold">Генерация вопросов</span>
                        <span id="generationProgressLabel" class="text-muted">0 / 0</span>
                    </div>
                    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"
                        id="generationProgressTrack">
                        <div id="generationProgressBar" class="progress-bar progress-bar-striped progress-bar-animated"
                            style="width: 0%">0%</div>
                    </div>
                </div>
            </div>
            <div id="questions"></div>
            <div class="btn-group gap-2 mt-3" style="display: none;" id="downloadBtns">
                <button id="downloadCsvBtn" class="btn btn-success">Скачать CSV</button>
                <button id="downloadXlsxBtn" class="btn btn-success">Скачать XLSX</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentQuestionId = null;
        let activeJob = null;
        const MIN_TEXT_LENGTH = {{ min_text_length }};
        const MAX_TEXT_LENGTH = {{ max_text_length }};
        const MIN_NUM_QUESTIONS = {{ min_num_questions }};
        const MAX_NUM_QUESTIONS = {{ max_num_questions }};

        function getTrimmedTextLength(value) {
            return value.trim().length;
        }

        function clampNumQuestions(value) {
            const parsed = parseInt(value, 10);
            if (Number.isNaN(parsed) || parsed < MIN_NUM_QUESTIONS) {
                return MIN_NUM_QUESTIONS;
            }
            if (parsed > MAX_NUM_QUESTIONS) {
                return MAX_NUM_QUESTIONS;
            }
            return parsed;
        }

        function syncNumQuestions(sourceId, targetId) {
            const source = document.getElementById(sourceId);
            const clamped = clampNumQuestions(source.value);
            source.value = clamped;
            document.getElementById(targetId).value = clamped;
            return clamped;
        }

        function updateTextLengthCounter() {
            const textArea = document.getElementById('text');
            document.getElementById('textLength').textContent = getTrimmedTextLength(textArea.value);
        }

        function validateTextLength(text, emptyMessage) {
            const trimmed = text.trim();
            if (!trimmed) {
                return emptyMessage;
            }
            const length = trimmed.length;
            if (length < MIN_TEXT_LENGTH) {
                return `Текст слишком короткий. Минимальная длина: ${MIN_TEXT_LENGTH} символов`;
            }
            if (length > MAX_TEXT_LENGTH) {
                return `Текст слишком длинный. Максимальная длина: ${MAX_TEXT_LENGTH} символов`;
            }
            return null;
        }

        const POLL_INTERVAL_MS = {{ poll_interval_ms }};
        const POLL_MAX_MS = {{ poll_max_ms }};

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('text').addEventListener('input', updateTextLengthCounter);
        updateTextLengthCounter();
        document.getElementById('numQuestions').addEventListener('input', function () {
            syncNumQuestions('numQuestions', 'numQuestionsSimplified');
        });

        document.getElementById('numQuestions').addEventListener('change', function () {
            syncNumQuestions('numQuestions', 'numQuestionsSimplified');
        });

        document.getElementById('numQuestionsSimplified').addEventListener('input', function () {
            syncNumQuestions('numQuestionsSimplified', 'numQuestions');
        });

        document.getElementById('numQuestionsSimplified').addEventListener('change', function () {
            syncNumQuestions('numQuestionsSimplified', 'numQuestions');
        });

        document.getElementById('generateBtn').addEventListener('click', function (e) {
            e.preventDefault();
            const textArea = document.getElementById('text');
            const text = textArea.value.trim();
            const validationError = validateTextLength(
                textArea.value,
                'Пожалуйста, введите текст для генерации вопросов'
            );

            if (validationError) {
                textArea.classList.add('is-invalid');
                showFlashMessage(validationError, 'warning');
                return;
            }

            textArea.classList.remove('is-invalid');
            const numQuestions = syncNumQuestions('numQuestions', 'numQuestionsSimplified');
            startGeneration(
                text,
                numQuestions,
                document.getElementById('generateBtn'),
                document.getElementById('cancelGenerateBtn')
            );
        });

        document.getElementById('downloadCsvBtn').addEventListener('click', function () {
            const selectedQuestions = getSelectedQuestions();
            if (selectedQuestions.length === 0) {
                showFlashMessage('Пожалуйста, выберите хотя бы один вопрос для скачивания', 'warning');
                return;
            }
            const questionParam = currentQuestionId ? `&question_id=${currentQuestionId}` : '';
            window.location.href = `/download?format=csv&questions=${selectedQuestions.join(',')}${questionParam}`;
        });

        document.getElementById('downloadXlsxBtn').addEventListener('click', function () {
            const selectedQuestions = getSelectedQuestions();
            if (selectedQuestions.length === 0) {
                showFlashMessage('Пожалуйста, выберите хотя бы один вопрос для скачивания', 'warning');
                return;
            }
            const questionParam = currentQuestionId ? `&question_id=${currentQuestionId}` : '';
            window.location.href = `/download?format=xlsx&questions=${selectedQuestions.join(',')}${questionParam}`;
        });

        document.getElementById('simplifyBtn').addEventListener('click', function () {
            const textArea = document.getElementById('text');
            const text = textArea.value.trim();
            const validationError = validateTextLength(
                textArea.value,
                'Пожалуйста, введите текст для упрощения'
            );

            if (validationError) {
                textArea.classList.add('is-invalid');
                showFlashMessage(validationError, 'warning');
                return;
            }

            textArea.classList.remove('is-invalid');

            const simplifyBtn = document.getElementById('simplifyBtn');
            startJob(
                '/simplify',
                { text },
                simplifyBtn,
                document.getElementById('cancelSimplifyBtn'),
                'Упрощение...',
                'Упростить текст',
                (data) => {
                    if (data.status === 'cancelled') {
                        showFlashMessage('Упрощение остановлено', 'warning');
                        return;
                    }
                    if (data.error) {
                        showFlashMessage(data.error, 'danger');
                        return;
                    }
                    document.getElementById('simplifiedText').innerHTML = `<p>${escapeHtml(data.simplified_text)}</p>`;
                    document.getElementById('simplified-tab').click();
                    document.getElementById('generateSimplifiedBtn').disabled = false;
                }
            );
        });

        document.getElementById('generateSimplifiedBtn').addEventListener('click', function () {
            const text = document.getElementById('simplifiedText').innerText.trim();
            const validationError = validateTextLength(
                text,
                'Пожалуйста, сначала упростите текст'
            );

            if (validationError) {
                showFlashMessage(validationError, 'warning');
                return;
            }

            const generateBtn = document.getElementById('generateSimplifiedBtn');
            const numQuestions = syncNumQuestions('numQuestionsSimplified', 'numQuestions');
            startGeneration(
                text,
                numQuestions,
                generateBtn,
                document.getElementById('cancelGenerateSimplifiedBtn')
            );
        });

        function setButtonLoading(button, loading, loadingText, defaultText) {
            const spinner = button.querySelector('.spinner-border');
            const btnText = button.querySelector('.btn-text');
            spinner.classList.toggle('d-none', !loading);
            btnText.textContent = loading ? loadingText : defaultText;
            button.disabled = loading;
        }

        function setCancelVisible(cancelBtn, visible) {
            if (!cancelBtn) {
                return;
            }
            cancelBtn.classList.toggle('d-none', !visible);
            cancelBtn.disabled = !visible;
        }

        function clearActiveJob() {
            if (activeJob && activeJob.pollTimer) {
                clearTimeout(activeJob.pollTimer);
            }
            activeJob = null;
        }

        function finishJobUi(button, cancelBtn, loadingText, defaultText) {
            clearActiveJob();
            setCancelVisible(cancelBtn, false);
            setButtonLoading(button, false, loadingText, defaultText);
            setPreviousQuestionsStale(false);
            hideGenerationProgress();
        }

        function setPreviousQuestionsStale(stale) {
            const questionsDiv = document.getElementById('questions');
            const downloadBtns = document.getElementById('downloadBtns');
            const hasQuestions = questionsDiv.children.length > 0;

            questionsDiv.classList.toggle('questions-stale', stale && hasQuestions);
            downloadBtns.classList.toggle(
                'questions-stale',
                stale && downloadBtns.style.display !== 'none'
            );
        }

        function showGenerationProgress(current, total) {
            const wrap = document.getElementById('questionsResults');
            const panel = document.getElementById('generationProgress');
            const label = document.getElementById('generationProgressLabel');
            const bar = document.getElementById('generationProgressBar');
            const track = document.getElementById('generationProgressTrack');
            const safeTotal = Math.max(1, Number(total) || 0);
            const safeCurrent = Math.max(0, Math.min(Number(current) || 0, safeTotal));
            const percent = Math.round((safeCurrent / safeTotal) * 100);

            wrap.classList.add('has-generation-progress');
            panel.classList.remove('d-none');
            label.textContent = `${safeCurrent} / ${safeTotal}`;
            bar.style.width = `${percent}%`;
            bar.textContent = `${percent}%`;
            track.setAttribute('aria-valuenow', String(percent));
            track.setAttribute('aria-valuemax', '100');
            track.setAttribute(
                'aria-valuetext',
                `${safeCurrent} из ${safeTotal} вопросов`
            );
        }

        function hideGenerationProgress() {
            const wrap = document.getElementById('questionsResults');
            const panel = document.getElementById('generationProgress');
            wrap.classList.remove('has-generation-progress');
            panel.classList.add('d-none');
        }

        function requestJobCancel(jobId) {
            return fetch(`/jobs/${jobId}/cancel`, {
                method: 'POST',
                credentials: 'same-origin',
            }).then(response => {
                if (!response.ok) {
                    throw new Error('Не удалось остановить задачу');
                }
                return response.json();
            });
        }

        function applyCancelledGeneration(data) {
            if (data.questions && data.questions.length) {
                currentQuestionId = data.question_id;
                updateQuestionsDisplay(data);
                showFlashMessage(
                    `Генерация остановлена. Показано вопросов: ${data.questions.length}`,
                    'warning'
                );
                return;
            }
            showFlashMessage('Генерация остановлена', 'warning');
        }

        function waitForCancelledGeneration(jobId, attemptsLeft = 8) {
            return fetch(`/jobs/${jobId}`, { credentials: 'same-origin' })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Задача не найдена');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'done' && data.questions && data.questions.length) {
                        return data;
                    }
                    if (data.status === 'cancelled') {
                        if (data.questions && data.questions.length) {
                            return data;
                        }
                        // Worker may still be finishing the current LLM call.
                        if (attemptsLeft > 1) {
                            return new Promise(resolve => {
                                setTimeout(resolve, POLL_INTERVAL_MS);
                            }).then(() => waitForCancelledGeneration(jobId, attemptsLeft - 1));
                        }
                        return data;
                    }
                    if (attemptsLeft > 1 && (data.status === 'pending' || data.status === 'running')) {
                        return new Promise(resolve => {
                            setTimeout(resolve, POLL_INTERVAL_MS);
                        }).then(() => waitForCancelledGeneration(jobId, attemptsLeft - 1));
                    }
                    return data;
                });
        }

        function startGeneration(text, numQuestions, button, cancelBtn) {
            setPreviousQuestionsStale(true);
            showGenerationProgress(0, numQuestions);
            startJob(
                '/generate',
                { text, num_questions: numQuestions },
                button,
                cancelBtn,
                'Генерация...',
                'Сгенерировать вопросы',
                (data) => {
                    if (data.status === 'cancelled') {
                        applyCancelledGeneration(data);
                        return;
                    }
                    if (data.status === 'done') {
                        if (!data.questions || !data.questions.length) {
                            showFlashMessage('Вопросы не получены. Попробуйте снова.', 'danger');
                            return;
                        }
                        currentQuestionId = data.question_id;
                        updateQuestionsDisplay(data);
                    } else if (data.error) {
                        updateQuestionsDisplay({ error: data.error });
                    }
                }
            );
        }

        function cancelActiveJob() {
            if (!activeJob) {
                return;
            }

            const { jobId, button, cancelBtn, loadingText, defaultText } = activeJob;
            const isSimplify = button.id === 'simplifyBtn';
            activeJob.cancelRequested = true;
            activeJob.cancelling = true;
            if (activeJob.pollTimer) {
                clearTimeout(activeJob.pollTimer);
                activeJob.pollTimer = null;
            }
            if (cancelBtn) {
                cancelBtn.disabled = true;
            }

            if (!jobId) {
                return;
            }

            requestJobCancel(jobId)
                .then(data => {
                    if (!activeJob || activeJob.jobId !== jobId) {
                        return null;
                    }
                    if (data.status === 'done' && data.questions && data.questions.length) {
                        finishJobUi(button, cancelBtn, loadingText, defaultText);
                        currentQuestionId = data.question_id;
                        updateQuestionsDisplay(data);
                        return null;
                    }
                    if (data.status !== 'cancelled') {
                        activeJob.cancelRequested = false;
                        if (cancelBtn) {
                            cancelBtn.disabled = false;
                        }
                        return null;
                    }
                    if (isSimplify) {
                        finishJobUi(button, cancelBtn, loadingText, defaultText);
                        showFlashMessage('Упрощение остановлено', 'warning');
                        return null;
                    }
                    if (data.questions && data.questions.length) {
                        finishJobUi(button, cancelBtn, loadingText, defaultText);
                        applyCancelledGeneration(data);
                        return null;
                    }
                    // Keep UI in loading state briefly while worker saves partials.
                    return waitForCancelledGeneration(jobId).then(finalData => {
                        if (!activeJob || activeJob.jobId !== jobId) {
                            return;
                        }
                        finishJobUi(button, cancelBtn, loadingText, defaultText);
                        applyCancelledGeneration(finalData || data);
                    });
                })
                .catch(error => {
                    console.error('Error:', error);
                    showFlashMessage('Не удалось остановить задачу', 'danger');
                    if (cancelBtn && activeJob && activeJob.jobId === jobId) {
                        activeJob.cancelRequested = false;
                        cancelBtn.disabled = false;
                    }
                });
        }

        function startJob(url, params, button, cancelBtn, loadingText, defaultText, onComplete) {
            clearActiveJob();
            setButtonLoading(button, true, loadingText, defaultText);
            setCancelVisible(cancelBtn, true);

            activeJob = {
                jobId: null,
                pollTimer: null,
                cancelRequested: false,
                button,
                cancelBtn,
                loadingText,
                defaultText,
            };

            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                credentials: 'same-origin',
                body: JSON.stringify(params),
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Не удалось запустить задачу');
                    }
                    return response.json();
                })
                .then(data => {
                    if (!activeJob || activeJob.button !== button) {
                        return;
                    }
                    activeJob.jobId = data.job_id;
                    if (activeJob.cancelRequested) {
                        return requestJobCancel(data.job_id).then(cancelData => {
                            if (!activeJob || activeJob.jobId !== data.job_id) {
                                return;
                            }
                            if (cancelData.status === 'done' && cancelData.questions) {
                                finishJobUi(button, cancelBtn, loadingText, defaultText);
                                currentQuestionId = cancelData.question_id;
                                updateQuestionsDisplay(cancelData);
                                return;
                            }
                            if (cancelData.status === 'cancelled') {
                                if (button.id === 'simplifyBtn') {
                                    finishJobUi(button, cancelBtn, loadingText, defaultText);
                                    showFlashMessage('Упрощение остановлено', 'warning');
                                    return;
                                }
                                if (cancelData.questions && cancelData.questions.length) {
                                    finishJobUi(button, cancelBtn, loadingText, defaultText);
                                    applyCancelledGeneration(cancelData);
                                    return;
                                }
                                return waitForCancelledGeneration(data.job_id).then(finalData => {
                                    if (!activeJob || activeJob.jobId !== data.job_id) {
                                        return;
                                    }
                                    finishJobUi(button, cancelBtn, loadingText, defaultText);
                                    applyCancelledGeneration(finalData || cancelData);
                                });
                            }
                            activeJob.cancelRequested = false;
                            if (cancelBtn) {
                                cancelBtn.disabled = false;
                            }
                            pollJob(data.job_id, button, cancelBtn, loadingText, defaultText, onComplete);
                        });
                    }
                    pollJob(data.job_id, button, cancelBtn, loadingText, defaultText, onComplete);
                })
                .catch(error => {
                    console.error('Error:', error);
                    showFlashMessage('Произошла ошибка при обработке запроса', 'danger');
                    finishJobUi(button, cancelBtn, loadingText, defaultText);
                });
        }

        function pollJob(jobId, button, cancelBtn, loadingText, defaultText, onComplete, startedAt = Date.now()) {
            if (!activeJob || activeJob.jobId !== jobId) {
                return;
            }

            if (Date.now() - startedAt > POLL_MAX_MS) {
                showFlashMessage('Превышено время ожидания. Попробуйте снова.', 'danger');
                finishJobUi(button, cancelBtn, loadingText, defaultText);
                return;
            }

            fetch(`/jobs/${jobId}`, { credentials: 'same-origin' })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Задача не найдена');
                    }
                    return response.json();
                })
                .then(data => {
                    if (!activeJob || activeJob.jobId !== jobId || activeJob.cancelling) {
                        return;
                    }

                    if (data.status === 'pending' || data.status === 'running') {
                        if (data.progress_total != null) {
                            showGenerationProgress(
                                data.progress_current || 0,
                                data.progress_total
                            );
                        }
                        activeJob.pollTimer = setTimeout(
                            () => pollJob(jobId, button, cancelBtn, loadingText, defaultText, onComplete, startedAt),
                            POLL_INTERVAL_MS
                        );
                        return;
                    }

                    try {
                        onComplete(data);
                    } catch (error) {
                        console.error('Error:', error);
                        showFlashMessage('Ошибка отображения результата', 'danger');
                    }
                    finishJobUi(button, cancelBtn, loadingText, defaultText);
                })
                .catch(error => {
                    if (!activeJob || activeJob.jobId !== jobId) {
                        return;
                    }
                    console.error('Error:', error);
                    showFlashMessage('Произошла ошибка при получении результата', 'danger');
                    finishJobUi(button, cancelBtn, loadingText, defaultText);
                });
        }

        document.getElementById('cancelSimplifyBtn').addEventListener('click', cancelActiveJob);
        document.getElementById('cancelGenerateBtn').addEventListener('click', cancelActiveJob);
        document.getElementById('cancelGenerateSimplifiedBtn').addEventListener('click', cancelActiveJob);

        function showFlashMessage(message, type) {
            const alertContainer = document.querySelector('.alert-container') || (() => {
                const container = document.createElement('div');
                container.className = 'alert-container';
                document.body.prepend(container);
                return container;
            })();

            const flashDiv = document.createElement('div');
            flashDiv.className = `alert alert-${type} alert-dismissible`;
            flashDiv.role = 'alert';
            flashDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;

            alertContainer.appendChild(flashDiv);

            if (type !== 'danger') {
                setTimeout(() => {
                    flashDiv.classList.add('fade-out');
                    setTimeout(() => {
                        flashDiv.remove();
                        if (alertContainer.children.length === 0) {
                            alertContainer.remove();
                        }
                    }, 500);
                }, 2000);
            }
        }

        document.querySelectorAll('button[data-bs-toggle="tab"]').forEach(tab => {
            tab.addEventListener('shown.bs.tab', function (event) {
                if (event.target.id === 'simplified-tab') {
                    const simplifiedText = document.getElementById('simplifiedText').innerText;
                    document.getElementById('generateSimplifiedBtn').disabled = !simplifiedText.trim();
                }
            });
        });

        function updateQuestionsDisplay(data) {
            const questionsDiv = document.getElementById('questions');
            hideGenerationProgress();
            setPreviousQuestionsStale(false);
            questionsDiv.innerHTML = '';

            if (data.error) {
                showFlashMessage(data.error, 'danger');
                document.getElementById('downloadBtns').style.display = 'none';
            } else {
                const selectAllHtml = `
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="selectAll">
                            <label class="form-check-label" for="selectAll">
                                Выбрать все
                            </label>
                        </div>
                    </div>
                `;
                questionsDiv.innerHTML = selectAllHtml;

                data.questions.forEach((item, index) => {
                    const questionHtml = `
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="d-flex align-items-start gap-2">
                                    <div class="form-check">
                                        <input class="form-check-input question-checkbox" type="checkbox" 
                                            value="${index}" id="question${index}" checked>
                                    </div>
                                    <div class="flex-grow-1">
                                        <h5 class="card-title">${index + 1}. ${escapeHtml(item.question)}</h5>
                                        <ul class="list-group mb-3">
                                            ${item.options.map(option => `<li class="list-group-item">${escapeHtml(option)}</li>`).join('')}
                                        </ul>
                                        <p class="card-text"><strong>Правильный ответ:</strong> ${escapeHtml(item.answer)}</p>
                                        <p class="card-text"><strong>Тема:</strong> ${escapeHtml(String(item.topic_number))} ${escapeHtml(item.topic)}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    questionsDiv.innerHTML += questionHtml;
                });

                document.getElementById('downloadBtns').style.display = 'inline-flex';

                document.getElementById('selectAll').addEventListener('change', function () {
                    const checkboxes = document.querySelectorAll('.question-checkbox');
                    checkboxes.forEach(checkbox => {
                        checkbox.checked = this.checked;
                    });
                });

                document.querySelectorAll('.question-checkbox').forEach(checkbox => {
                    checkbox.addEventListener('change', function () {
                        const allCheckboxes = document.querySelectorAll('.question-checkbox');
                        const selectAllCheckbox = document.getElementById('selectAll');
                        selectAllCheckbox.checked = Array.from(allCheckboxes).every(cb => cb.checked);
                    });
                });
            }
        }

        function getSelectedQuestions() {
            const checkboxes = document.querySelectorAll('.question-checkbox:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }
    </script>
</body>

</html>
